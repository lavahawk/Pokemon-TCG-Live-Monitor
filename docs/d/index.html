<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="A Pokémon TCG Live decklist shared with Pokemon TCG Live Monitor.">
<title>shared deck</title>
<style>
  :root { --bg: #0c0d0f; --fg: #d8dbe0; --dim: #6c7380; --rule: #23262c; --accent: #e8c547; --ok: #8fd18f;
          --bad: #ef8f8f; --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f6f5f1; --fg: #1d1f23; --dim: #7b7f88; --rule: #dcdad3; --accent: #9a6f00;
                                      --ok: #2e7d32; --bad: #b3261e; }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.6 var(--mono); }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; }
  a { color: inherit; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; white-space: nowrap; }
  header .brand { text-decoration: none; display: block; flex: 1; min-width: 0; overflow: hidden; }
  /* logo: banner letters in block characters over a field of stray ASCII; a yellow beam sweeps across */
  .logo { margin: 0; font: 4.2px/1 var(--mono); letter-spacing: 0; white-space: pre; user-select: none;
          height: 7em; overflow: hidden; color: var(--fg); }
  .logo .y { color: var(--accent); }
  .logo .yd { color: var(--accent); opacity: .5; }
  .logo .w { color: #fff6cf; }
  .logo .r { color: var(--rule); }
  .logo .d { color: var(--dim); }
  header nav a { color: var(--dim); text-decoration: none; margin-left: 14px; }
  header nav a:hover { color: var(--fg); }
  .rule { color: var(--rule); overflow: hidden; white-space: nowrap; user-select: none; }
  h1 { font-size: 22px; line-height: 1.3; margin: 14px 0 2px; font-weight: 700; overflow-wrap: anywhere; }
  .dim { color: var(--dim); }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .actions { margin: 14px 0 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  button, .btn { font: inherit; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer;
                 text-decoration: none; }
  button::before, .btn::before { content: "["; color: var(--dim); }
  button::after, .btn::after { content: "]"; color: var(--dim); }
  button:hover, .btn:hover { color: var(--accent); }
  .primary { color: var(--accent); }
  pre { margin: 0; font: inherit; white-space: pre-wrap; }
  .list { margin-top: 18px; }
  .row { display: flex; gap: 10px; }
  .row .q { width: 2ch; text-align: right; color: var(--accent); flex: none; }
  .row .n { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .row .n::after { content: " ............................................................"; color: var(--rule); }
  .row .s { color: var(--dim); flex: none; }
  .head { margin-top: 14px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; margin-top: 22px;
          opacity: 0; transition: opacity .6s ease; }
  .grid.on { opacity: 1; }
  .card { position: relative; aspect-ratio: 63 / 88; background: var(--rule); border-radius: 4px; overflow: hidden;
          cursor: zoom-in; transition: transform .12s ease; }
  .card:hover { transform: translateY(-2px); }
  .row { cursor: zoom-in; }
  .row:hover .n { color: var(--accent); }
  .zoom { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 10px; padding: 16px; background: rgba(6,7,9,.82); cursor: zoom-out;
          opacity: 0; transition: opacity .15s ease; }
  .zoom.on { opacity: 1; }
  .zoom img { max-height: min(78vh, 700px); max-width: 100%; aspect-ratio: 63 / 88; border-radius: 14px;
              box-shadow: 0 18px 60px rgba(0,0,0,.6); transform: scale(.94); transition: transform .18s ease;
              background: #1a1c20 center / cover no-repeat; }
  .zoom.on img { transform: none; }
  .zoom .cap { color: #d8dbe0; text-align: center; cursor: default; }
  .zoom .cap a { color: #e8c547; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card b { position: absolute; right: 4px; bottom: 4px; min-width: 22px; padding: 0 5px; text-align: center;
            background: rgba(12,13,15,.86); color: #fff; border-radius: 3px; font-weight: 700; }
  .card i { position: absolute; inset: 6px; font-style: normal; font-size: 11px; color: var(--dim); }
  footer { margin-top: 30px; color: var(--dim); }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 480px) { header nav a:first-child { display: none; } h1 { font-size: 19px; } }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="https://github.com/lavahawk/Pokemon-TCG-Live-Monitor#readme" aria-label="PTCGL Monitor"><pre class="logo" id="logo" aria-hidden="true">PTCGL MONITOR</pre></a>
    <nav><a href="https://github.com/lavahawk/Pokemon-TCG-Live-Monitor#readme">about</a><a href="https://github.com/lavahawk/Pokemon-TCG-Live-Monitor/releases/latest">get the app</a></nav>
  </header>
  <div class="rule" aria-hidden="true">────────────────────────────────────────────────────────────────────────────────────────────────────────</div>
  <div id="out" aria-live="polite">
    <div class="t dim">&gt; shared deck</div>
    <h1 class="t" id="name">loading…</h1>
    <div class="t dim" id="counts"></div>
  </div>
  <div class="actions" id="actions" hidden>
    <button class="primary" id="copy">copy list</button>
    <a class="btn" id="open">open in app</a>
    <button id="limitless">view on limitless ↗</button>
  </div>
  <div class="t dim" id="note"></div>
  <div class="list" id="list"></div>
  <div class="grid" id="grid" aria-label="Cards"></div>
  <footer class="t">the list lives in the link. nothing is stored or sent anywhere.</footer>
  <form id="imggen" method="post" action="https://limitlesstcg.com/tools/imggen" target="_blank" hidden>
    <input type="hidden" name="_token" value=""><input type="hidden" name="input" id="imggen-input">
    <input type="hidden" name="sort" value="on">
  </form>
</main>
<script>
// Mirrors deck_share.py (version a = varint stream, b = the same raw-deflated).
const SECTIONS = ["Pokémon", "Trainer", "Energy"];
const ENERGY = { G: "Grass", R: "Fire", W: "Water", L: "Lightning", P: "Psychic", F: "Fighting", D: "Darkness",
                 M: "Metal", Y: "Fairy", N: "Dragon", C: "Colorless" };  // display only; copies keep PTCGL's {X}
const LINE = /^\s*(\d+)\s+(.+?)\s+([A-Za-z0-9][A-Za-z0-9-]{1,6})\s+(\d+[A-Za-z]?)\s*$/;

function b64(text) {
  const s = text.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "=".repeat((4 - s.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function decode(token, table) {
  if (!/^[ab][A-Za-z0-9_-]{4,4000}$/.test(token)) throw new Error("not a deck link");
  let data = b64(token.slice(1));
  if (token[0] === "b") data = await inflateRaw(data);
  const out = SECTIONS.map(() => []);
  let section = 0, pos = 0;
  const varint = () => {
    let value = 0, shift = 0;
    for (;;) {
      if (pos >= data.length || shift > 35) throw new Error("damaged link");
      const byte = data[pos++];
      value += (byte & 0x7f) * 2 ** shift;
      if (!(byte & 0x80)) return value;
      shift += 7;
    }
  };
  while (pos < data.length) {
    const v = varint();
    if (v === 0) { if (++section >= SECTIONS.length) throw new Error("damaged link"); continue; }
    let qty = v % 8, ref = Math.floor(v / 8);
    if (qty === 0) { qty = ref; ref = varint(); }
    let card;
    if (ref % 2 === 0) {
      card = table[ref / 2];
      if (card === undefined) throw new Error("this link needs a newer version of the page");
    } else {
      const size = (ref - 1) / 2;
      const raw = data.slice(pos, pos + size); pos += size;
      if (raw.length !== size) throw new Error("damaged link");
      card = new TextDecoder().decode(raw);
      if (/[\x00-\x1f\x7f]/.test(card)) throw new Error("damaged link");
    }
    const m = LINE.exec(`${qty} ${card}`);
    if (!m || qty < 1 || qty > 60) throw new Error("damaged link");
    out[section].push({ qty, name: m[2], set: m[3], number: m[4] });
  }
  return out;
}

function exportText(sections) {
  let total = 0;
  const parts = SECTIONS.map((name, i) => {
    total += sections[i].reduce((n, c) => n + c.qty, 0);
    // PTCGL's export counts lines in the section headings
    return [`${name}: ${sections[i].length}`, ...sections[i].map(c => `${c.qty} ${c.name} ${c.set} ${c.number}`)].join("\n");
  });
  return parts.join("\n\n") + `\n\nTotal Cards: ${total}`;
}

// ── page ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const pretty = name => name.replace(/\{(\w)\}/g, (m, s) => ENERGY[s.toUpperCase()] || s);
const IMAGE_SETS = { "PR-SV": "SVP", "PR-SW": "SWSHP" };  // same as decklists.card_image_url
function cardImage(set, number) {
  const code = IMAGE_SETS[set.toUpperCase()] || set.toUpperCase();
  const m = /^(\d+)(.*)$/.exec(number);
  const padded = m ? m[1].padStart(3, "0") + m[2] : number;
  return `https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/${code}/${code}_${padded}_R_EN_SM.png`;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function render(sections, name) {
  const total = sections.flat().reduce((n, c) => n + c.qty, 0);
  if (total < 40 || total > 70) throw new Error("the link doesn't hold a full deck");
  $("name").textContent = name || "shared deck";
  document.title = (name || "shared deck") + " · decklist";
  $("counts").textContent = SECTIONS.map((s, i) =>
    `${sections[i].reduce((n, c) => n + c.qty, 0)} ${s.toLowerCase()}`).join(" · ") + ` · ${total} cards`;
  const list = $("list"), grid = $("grid");
  SECTIONS.forEach((title, i) => {
    if (!sections[i].length) return;
    const count = sections[i].reduce((n, c) => n + c.qty, 0);
    list.append(el("div", "t head", `── ${title.toUpperCase()} (${count}) ${"─".repeat(Math.max(4, 40 - title.length))}`));
    for (const c of sections[i]) {
      const row = el("div", "row t");
      row.append(el("span", "q", c.qty), el("span", "n", pretty(c.name)), el("span", "s", `${c.set} ${c.number}`));
      row.onclick = () => zoomCard(c);
      list.append(row);
      const card = el("div", "card");
      card.onclick = () => zoomCard(c);
      const img = new Image();
      img.loading = "lazy";
      img.alt = `${c.qty} × ${pretty(c.name)} (${c.set} ${c.number})`;
      img.src = cardImage(c.set, c.number);
      img.onerror = () => { img.remove(); card.append(el("i", "", `${pretty(c.name)}\n${c.set} ${c.number}`)); };
      card.append(img, el("b", "", c.qty));
      grid.append(card);
    }
  });
}

// ── logo: "PTCGL MONITOR" in a thin 5x6 pixel font drawn with block characters,
// over a field of stray ASCII; a yellow beam sweeps through both ──
const GLYPHS = {
  P: ["####.", "#...#", "#...#", "####.", "#....", "#...."], T: ["#####", "..#..", "..#..", "..#..", "..#..", "..#.."],
  C: [".###.", "#...#", "#....", "#....", "#...#", ".###."], G: [".###.", "#....", "#....", "#..##", "#...#", ".###."],
  L: ["#....", "#....", "#....", "#....", "#....", "#####"], M: ["#...#", "##.##", "#.#.#", "#...#", "#...#", "#...#"],
  O: [".###.", "#...#", "#...#", "#...#", "#...#", ".###."], N: ["#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#"],
  I: ["###", ".#.", ".#.", ".#.", ".#.", "###"], R: ["####.", "#...#", "#...#", "####.", "#..#.", "#...#"],
  " ": ["..", "..", "..", "..", "..", ".."],
};
function startLogo() {
  const pre = $("logo"), NAME = "PTCGL MONITOR", ROWS = 7;  // six letter rows and one for the shadow
  const bits = Array.from({ length: 6 }, () => []);
  for (const ch of NAME) GLYPHS[ch].forEach((line, y) => { for (const b of line + ".") bits[y].push(b === "#"); });
  const W = (bits[0].length - 1) * 2;  // two characters per pixel keeps the pixels square
  const ink = (sx, y) => y >= 0 && y < 6 && sx >= 0 && sx < W && bits[y][sx >> 1];
  const STRAY = "./\\|-_:;+*=~^`',<>[]{}()?!#%&$@";
  const SPARK = "#@%&$*+=";
  const hash = (a, b, c) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
  let cols = W + 2;
  const fit = () => {  // small letters (4.2px at most)
    const room = pre.parentElement.clientWidth;
    const size = Math.min(4.2, Math.floor(room / ((W + 2) * 0.6) * 10) / 10);
    pre.style.fontSize = size + "px";
    cols = W + 6;  // the grain stays just around the name
  };
  const draw = t => {
    const period = 3.4, beam = ((t % period) / period) * (cols + 40) - 20;
    let html = "";
    for (let y = 0; y < ROWS; y++) {
      let run = "", cls = null;
      const put = (c, k) => {
        if (k !== cls) { if (run) html += cls ? `<span class="${cls}">${run}</span>` : run; run = ""; cls = k; }
        run += c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c;
      };
      for (let sx = 0; sx < cols; sx++) {
        const d = Math.abs(sx - beam - (y - 3) * 2.6);  // slanted beam
        const flick = Math.floor(t * 9 + hash(sx, y, 3) * 9);
        if (ink(sx, y)) {
          if (d < 2) put(SPARK[Math.floor(hash(sx, y, flick) * SPARK.length)], "w");
          else if (hash(sx, y, Math.floor(t * 2.5 + hash(sx, y, 5) * 4)) < 0.07) put(STRAY[Math.floor(hash(sx, y, flick) * STRAY.length)], d < 5 ? "y" : null);  // frayed strokes
          else put("█", d < 5 ? "y" : null);
        } else if (ink(sx - 1, y - 1) || ink(sx - 2, y - 1)) {
          put("░", d < 5 ? "yd" : "d");  // drop shadow, one row down and to the right
        } else {
          // stray ASCII: sparse, each cell changing now and then; the beam lights it up
          const slow = Math.floor(t * 0.7 + hash(sx, y, 9) * 5);
          const dense = sx < W + 4 ? 0.2 : 0.26;
          if (hash(sx, y, slow) < dense || d < 2.2 && hash(sx, y, flick) < 0.35) {
            put(STRAY[Math.floor(hash(sx, y, slow + 7) * STRAY.length)], d < 2 ? "y" : d < 6 ? "yd" : "d");
          } else put(" ", cls);
        }
      }
      if (run) html += cls ? `<span class="${cls}">${run}</span>` : run;
      if (y < ROWS - 1) html += "\n";
    }
    pre.innerHTML = html;
  };
  fit();
  addEventListener("resize", fit);
  draw(1.5);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let last = 0;
  const tick = now => {
    if (now - last > 33) { last = now; draw(now / 1000); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── click a card: the large scan, like Limitless's own preview ──
const LIMITLESS_SETS = { "PR-SV": "SVP", "PR-SW": "SWSHP" };
function zoomCard(c) {
  const box = el("div", "zoom");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", pretty(c.name));
  const small = cardImage(c.set, c.number);
  const img = new Image();
  img.alt = `${pretty(c.name)} (${c.set} ${c.number})`;
  img.style.backgroundImage = `url("${small}")`;  // the small scan shows while the large one loads
  img.src = small.replace(/_SM\.png$/, "_LG.png");
  img.onerror = () => { img.onerror = null; img.src = small; };
  const cap = el("div", "cap", `${c.qty} × ${pretty(c.name)} · ${c.set} ${c.number} · `);
  const link = el("a", "", "open on limitless ↗");
  const code = LIMITLESS_SETS[c.set.toUpperCase()] || c.set.toUpperCase();
  link.href = `https://limitlesstcg.com/cards/${encodeURIComponent(code)}/${encodeURIComponent(c.number)}`;
  link.target = "_blank";
  link.rel = "noopener";
  cap.append(link);
  box.append(img, cap);
  const onKey = e => { if (e.key === "Escape") close(); };
  const close = () => {
    document.removeEventListener("keydown", onKey);
    box.classList.remove("on");
    setTimeout(() => box.remove(), 160);
  };
  box.addEventListener("click", e => { if (!cap.contains(e.target)) close(); });
  document.addEventListener("keydown", onKey);
  document.body.append(box);
  requestAnimationFrame(() => box.classList.add("on"));
}

// Top-down typing: every .t line types out in order (skipped for reduced motion).
async function typeIn() {
  const lines = [...document.querySelectorAll(".t")].filter(n => n.offsetParent !== null || n.tagName === "FOOTER");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const jobs = lines.map(node => {
    const parts = [];
    const walk = n => n.nodeType === 3 ? parts.push([n, n.textContent]) : n.childNodes.forEach(walk);
    walk(node);
    node.style.visibility = "hidden";  // untyped lines (and their dot leaders) stay out of sight
    return { node, parts };
  });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  for (const job of jobs) {
    job.node.style.visibility = "";
    if (job.node.classList.contains("row")) {
      await sleep(30);  // list rows: one at a time, top to bottom
      continue;
    }
    job.parts.forEach(([n]) => { n.textContent = ""; });
    job.node.classList.add("cursor");
    for (const [n, text] of job.parts) {
      for (let i = 0; i < text.length; i++) { n.textContent = text.slice(0, i + 1); await sleep(12); }
    }
    job.node.classList.remove("cursor");
    await sleep(60);
  }
}

async function copyList(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}

// Hand the deck to the app. Chromium asks once and ignores an unknown scheme
// quietly; other browsers would show an error page for a top-level visit, so
// they get a hidden frame instead.
function openApp(url) {
  const chromium = !!(navigator.userAgentData && navigator.userAgentData.brands.length);
  if (chromium) { location.href = url; return; }
  const frame = document.createElement("iframe");
  frame.hidden = true;
  frame.src = url;
  document.body.append(frame);
  setTimeout(() => frame.remove(), 3000);
}

(async () => {
  startLogo();
  const note = $("note");
  try {
    const hash = location.hash.slice(1);
    if (!hash) throw new Error("this page needs a deck link");
    const [token, rawName = ""] = hash.split("~");
    const name = decodeURIComponent(rawName).replace(/[\x00-\x1f<>]/g, "").slice(0, 40);
    const tableText = await (await fetch("cards_v1.txt", { cache: "force-cache" })).text();
    const table = tableText.split(/\r?\n/).filter(l => l.trim() && !l.startsWith("#"));
    const sections = await decode(token, table);
    const text = exportText(sections);
    render(sections, name);
    $("actions").hidden = false;
    const appUrl = "ptcglmonitor://d#" + hash;
    $("open").href = appUrl;
    openApp(appUrl);
    $("copy").onclick = async () => {
      note.innerHTML = (await copyList(text))
        ? '<span class="ok">copied.</span> in pokémon tcg live: decks → create a deck → import'
        : '<span class="bad">couldn\'t copy</span> - select the list below instead';
    };
    $("limitless").onclick = () => { $("imggen-input").value = text; $("imggen").submit(); };
    // Copy right away when the browser allows it; otherwise on the first click.
    if (await copyList(text)) {
      note.innerHTML = '<span class="ok">list copied.</span> in pokémon tcg live: decks → create a deck → import';
    } else {
      note.textContent = "click anywhere to copy the list for pokémon tcg live";
      const once = async () => {
        document.removeEventListener("pointerdown", once, true);
        if (await copyList(text)) {
          note.innerHTML = '<span class="ok">list copied.</span> in pokémon tcg live: decks → create a deck → import';
        }
      };
      document.addEventListener("pointerdown", once, true);
    }
    await typeIn();
    $("grid").classList.add("on");
  } catch (err) {
    $("name").textContent = "can't open this deck";
    note.className = "bad";
    note.textContent = String(err.message || err).toLowerCase();
  }
})();
</script>
</body>
</html>
