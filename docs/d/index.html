<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shared deck</title>
<style>
  :root { --bg: #0e131b; --card: #151c27; --line: rgba(255,255,255,.09); --text: #e8eef6; --muted: #9aa8bb;
          --accent: #4a9fd8; --ok: #66bb6a; --bad: #ef9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 56px; }
  .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; }
  h1 { font-size: 26px; margin: 6px 0 4px; font-weight: 650; overflow-wrap: anywhere; }
  .counts { color: var(--muted); font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 8px; }
  button, a.button { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text);
           font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 7px; cursor: pointer; text-decoration: none; }
  button:hover, a.button:hover { background: rgba(255,255,255,.11); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .primary:hover { background: #5aaee6; }
  .note { color: var(--muted); font-size: 12px; min-height: 18px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 18px; }
  h2 { font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 10px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.04); }
  li:first-child { border-top: 0; }
  .qty { width: 22px; text-align: right; color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
  .set { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .error { color: var(--bad); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">SHARED DECK</div>
  <h1 id="name">Loading…</h1>
  <div class="counts" id="counts"></div>
  <div class="actions" id="actions" hidden>
    <a class="button primary" id="open">Open in the app</a>
    <button id="copy">Copy list for PTCGL</button>
  </div>
  <div class="note" id="note"></div>
  <div id="sections"></div>
  <footer>
    The list lives in the link itself; nothing is stored or sent anywhere.
    Made with <a href="https://github.com/lavahawk/Pokemon-TCG-Live-Monitor">Pokemon TCG Live Monitor</a>.
  </footer>
</main>
<script>
// Mirrors deck_share.py (version a = varint stream, b = the same raw-deflated).
const SECTIONS = ["Pokémon", "Trainer", "Energy"];
const ENERGY = { G: "Grass", R: "Fire", W: "Water", L: "Lightning", P: "Psychic", F: "Fighting", D: "Darkness",
                 M: "Metal", Y: "Fairy", N: "Dragon", C: "Colorless" };  // display only; copies keep PTCGL's {X}
const LINE = /^\s*(\d+)\s+(.+?)\s+([A-Za-z0-9][A-Za-z0-9-]{1,6})\s+(\d+[A-Za-z]?)\s*$/;

function b64(text) {
  const s = text.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "=".repeat((4 - s.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function decode(token, table) {
  if (!/^[ab][A-Za-z0-9_-]{4,4000}$/.test(token)) throw new Error("not a deck link");
  let data = b64(token.slice(1));
  if (token[0] === "b") data = await inflateRaw(data);
  const out = SECTIONS.map(() => []);
  let section = 0, pos = 0;
  const varint = () => {
    let value = 0, shift = 0;
    for (;;) {
      if (pos >= data.length || shift > 35) throw new Error("damaged link");
      const byte = data[pos++];
      value += (byte & 0x7f) * 2 ** shift;
      if (!(byte & 0x80)) return value;
      shift += 7;
    }
  };
  while (pos < data.length) {
    const v = varint();
    if (v === 0) { if (++section >= SECTIONS.length) throw new Error("damaged link"); continue; }
    let qty = v % 8, ref = Math.floor(v / 8);
    if (qty === 0) { qty = ref; ref = varint(); }
    let card;
    if (ref % 2 === 0) {
      card = table[ref / 2];
      if (card === undefined) throw new Error("this link needs a newer version of the page");
    } else {
      const size = (ref - 1) / 2;
      const raw = data.slice(pos, pos + size); pos += size;
      if (raw.length !== size) throw new Error("damaged link");
      card = new TextDecoder().decode(raw);
      if (/[\x00-\x1f\x7f]/.test(card)) throw new Error("damaged link");
    }
    const m = LINE.exec(`${qty} ${card}`);
    if (!m || qty < 1 || qty > 60) throw new Error("damaged link");
    out[section].push({ qty, name: m[2], set: m[3], number: m[4] });
  }
  return out;
}

function exportText(sections) {
  let total = 0;
  const parts = SECTIONS.map((name, i) => {
    total += sections[i].reduce((n, c) => n + c.qty, 0);
    // PTCGL's export counts lines in the section headings
    return [`${name}: ${sections[i].length}`, ...sections[i].map(c => `${c.qty} ${c.name} ${c.set} ${c.number}`)].join("\n");
  });
  return parts.join("\n\n") + `\n\nTotal Cards: ${total}`;
}

function show(sections, name) {
  const total = sections.flat().reduce((n, c) => n + c.qty, 0);
  if (total < 40 || total > 70) throw new Error("the link doesn't hold a full deck");
  document.getElementById("name").textContent = name || "Shared deck";
  document.title = (name || "Shared deck") + " · decklist";
  document.getElementById("counts").textContent =
    SECTIONS.map((s, i) => `${sections[i].reduce((n, c) => n + c.qty, 0)} ${s}`).join(" · ") + ` · ${total} cards`;
  const holder = document.getElementById("sections");
  SECTIONS.forEach((title, i) => {
    if (!sections[i].length) return;
    const box = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = title.toUpperCase();
    const ul = document.createElement("ul");
    for (const c of sections[i]) {
      const li = document.createElement("li");
      const q = document.createElement("span"); q.className = "qty"; q.textContent = c.qty;
      const n = document.createElement("span"); n.textContent = c.name.replace(/\{(\w)\}/g, (m, s) => ENERGY[s.toUpperCase()] || s);
      const s = document.createElement("span"); s.className = "set"; s.textContent = `${c.set} ${c.number}`;
      li.append(q, n, s); ul.append(li);
    }
    box.append(h, ul); holder.append(box);
  });
}

(async () => {
  const note = document.getElementById("note");
  try {
    const fragment = decodeURIComponent(location.hash.slice(1) || "");
    const [token, rawName = ""] = location.hash.slice(1).split("~");
    const name = decodeURIComponent(rawName).replace(/[\x00-\x1f<>]/g, "").slice(0, 40);
    if (!fragment) throw new Error("this page needs a deck link");
    const tableText = await (await fetch("cards_v1.txt", { cache: "force-cache" })).text();
    const table = tableText.split(/\r?\n/).filter(l => l.trim() && !l.startsWith("#"));
    const sections = await decode(token, table);
    show(sections, name);
    const appLink = "ptcglmonitor://d#" + location.hash.slice(1);
    const open = document.getElementById("open");
    open.href = appLink;
    document.getElementById("actions").hidden = false;
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(exportText(sections));
      note.textContent = "Copied. In Pokémon TCG Live: Decks → New deck → Import.";
    };
    note.textContent = "Opening the app… If nothing happens, copy the list and import it in Pokémon TCG Live.";
    location.href = appLink;  // the app asks before importing anything
  } catch (err) {
    document.getElementById("name").textContent = "Can't open this deck";
    note.className = "note error";
    note.textContent = String(err.message || err);
  }
})();
</script>
</body>
</html>
